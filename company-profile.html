<script>
(function () {
  var WEBHOOK_URL = 'https://n8ngc.codeblazar.org/webhook/company-profile';

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function websiteUrl(site) {
    var s = String(site == null ? '' : site).trim();
    if (!s) return '';
    return /^https?:\/\//i.test(s) ? s : 'https://' + s;
  }

  // n8n returns an unresolved expression template (e.g. "{{ $json.Overview }}")
  // when a workflow node isn't wired up correctly. Treat those - and empty
  // values - as "no data" so students never see raw template syntax on screen.
  function cleanField(val) {
    var s = String(val == null ? '' : val).trim();
    if (!s || /^\{\{[\s\S]*\}\}$/.test(s)) return '';
    return s;
  }

  function parseCsv(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;

    for (var i = 0; i < text.length; i += 1) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i += 1;
          } else {
            inQuotes = false;
          }
        } else {
          field += ch;
        }
      } else if (ch === '"') {
        inQuotes = true;
      } else if (ch === ',') {
        row.push(field);
        field = '';
      } else if (ch === '\r') {
        continue;
      } else if (ch === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
      } else {
        field += ch;
      }
    }

    if (field !== '' || row.length) {
      row.push(field);
      rows.push(row);
    }
    return rows;
  }

  /* ---------- fallback: look up a company's profile fields from the local
     CSV whenever the webhook comes back empty/unwired for a field - the
     backing n8n workflow is currently only returning a placeholder stub
     ({"myField":"value"}), so this keeps the page useful in the meantime
     without touching that workflow (owned by a teammate). ---------- */
  function loadLocalCompanyRow(name) {
    name = String(name || '').trim();
    if (!name) return Promise.resolve(null);

    return fetch('Companies.csv').then(function (res) {
      if (!res.ok) throw new Error('Local company data unavailable');
      return res.text();
    }).then(function (text) {
      var csv = parseCsv(text);
      if (!csv.length) return null;
      var header = csv[0].map(function (cell) { return String(cell || '').trim(); });
      var rows = csv.slice(1);
      for (var i = 0; i < rows.length; i += 1) {
        var item = rows[i];
        if (!item || item.length === 0) continue;
        var rowObj = {};
        header.forEach(function (key, idx) {
          rowObj[key] = String(item[idx] || '').trim();
        });
        if (rowObj['Company Name'].toLowerCase() === name.toLowerCase()) return rowObj;
      }
      return null;
    }).catch(function () { return null; });
  }

  function fillFromLocalCsv(data, name) {
    data = data || {};
    var needsFallback = !cleanField(data.overview) || !cleanField(data.website) ||
      !cleanField(data.expectations) || !cleanField(data.industry) ||
      !cleanField(data.careersLink) || !cleanField(data.resource);
    if (!needsFallback) return Promise.resolve(data);

    return loadLocalCompanyRow(name).then(function (row) {
      if (!row) return data;
      return {
        company: cleanField(data.company) || row['Company Name'] || '',
        industry: cleanField(data.industry) || row['Industry / Specialization'] || '',
        overview: cleanField(data.overview) || row['Overview'] || '',
        website: cleanField(data.website) || row['Website'] || '',
        careersLink: cleanField(data.careersLink) || row['Careers Link'] || '',
        expectations: cleanField(data.expectations) || row['Expectations'] || '',
        resource: cleanField(data.resource) || row['Resource'] || ''
      };
    });
  }

  var content = document.getElementById('flowContent');
  var titleEl = document.getElementById('cpCompanyName');
  var industryEl = document.getElementById('cpIndustry');

  var params = new URLSearchParams(window.location.search);
  var company = (params.get('company') || '').trim();

  if (!company) {
    content.innerHTML =
      '<div class="flow-empty"><p>No company was selected. Let\'s start from your career pathway.</p>' +
      '<a href="learning-hub.html" class="btn btn-primary">Choose Your Diploma &rarr;</a></div>';
    return;
  }

  titleEl.textContent = company;

  function renderLoading() {
    window.jrAiLoading(content, [
      'Loading company profile…',
      'Gathering hiring insights…',
      'Almost ready…'
    ]);
  }

  function renderProfile(data) {
    var name = cleanField(data.company) || company;
    var industry = cleanField(data.industry);
    var overview = cleanField(data.overview);
    var website = cleanField(data.website);
    var careersLink = cleanField(data.careersLink);
    var expectations = cleanField(data.expectations);
    var resource = cleanField(data.resource);

    titleEl.textContent = name;
    industryEl.textContent = industry || 'Company Profile';

    var overviewHtml = overview
      ? '<p class="profile-body">' + escapeHtml(overview) + '</p>'
      : '<p class="profile-body profile-body--empty">Not available yet.</p>';

    var siteUrl = websiteUrl(website);
    var careersUrl = websiteUrl(careersLink);
    var websiteLinks = [];
    if (siteUrl) {
      websiteLinks.push('<a class="profile-website-link" href="' + escapeHtml(siteUrl) + '" target="_blank" rel="noopener">' + escapeHtml(website) + ' &rarr;</a>');
    }
    if (careersUrl) {
      websiteLinks.push('<a class="profile-website-link" href="' + escapeHtml(careersUrl) + '" target="_blank" rel="noopener">Apply / Careers Page &rarr;</a>');
    }
    var websiteHtml = websiteLinks.length
      ? '<div style="display:flex;flex-direction:column;gap:.6rem;">' + websiteLinks.join('') + '</div>'
      : '<p class="profile-body profile-body--empty">Not available yet.</p>';

    var expectationsHtml = expectations
      ? '<p class="profile-body">' + escapeHtml(expectations) + '</p>'
      : '<p class="profile-body profile-body--empty">Not available yet.</p>';

    // No dedicated "Resource Link" column exists in Companies.csv - the
    // resource text links out to whatever's most relevant to actually act
    // on it, falling back from the careers page to the company site.
    var resourceLinkTarget = careersUrl || siteUrl;
    var resourceHtml = resource
      ? (resourceLinkTarget
          ? '<a class="profile-website-link" href="' + escapeHtml(resourceLinkTarget) + '" target="_blank" rel="noopener">' + escapeHtml(resource) + ' &rarr;</a>'
          : '<p class="profile-body">' + escapeHtml(resource) + '</p>')
      : '<p class="profile-body profile-body--empty">Not available yet.</p>';

    content.innerHTML =
      '<div class="pathway-card pathway-card-full">' +
        '<div class="pathway-card__head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg><span class="pathway-card__title">Overview</span></div>' +
        overviewHtml +
      '</div>' +
      '<div class="pathway-card pathway-card-full">' +
        '<div class="pathway-card__head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg><span class="pathway-card__title">Website</span></div>' +
        websiteHtml +
      '</div>' +
      '<div class="pathway-card pathway-card-full">' +
        '<div class="pathway-card__head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg><span class="pathway-card__title">What ' + escapeHtml(name) + ' Wants</span></div>' +
        expectationsHtml +
      '</div>' +
      '<div class="pathway-card pathway-card-full">' +
        '<div class="pathway-card__head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg><span class="pathway-card__title">Recommended Resource</span></div>' +
        resourceHtml +
      '</div>' +
      '<div style="text-align:center;margin-top:2rem;">' +
        '<button class="btn btn-primary" id="startQuizBtn">Start Company Quiz &rarr;</button>' +
      '</div>';

    document.getElementById('startQuizBtn').addEventListener('click', function () {
      sessionStorage.setItem('jobready_quiz_data', JSON.stringify({
        company: name,
        expectations: expectations
      }));
      window.location.href = 'company-quiz.html?company=' + encodeURIComponent(name);
    });
  }

  function renderError() {
    content.innerHTML =
      '<div class="career-error">Could not load this company\'s profile right now. Check your connection or try again. ' +
      '<button class="btn btn-ghost btn-sm" id="retryProfileBtn">Retry</button></div>';
    document.getElementById('retryProfileBtn').addEventListener('click', loadProfile);
  }

  function loadProfile() {
    renderLoading();

    var controller = new AbortController();
    var timeout = setTimeout(function () { controller.abort(); }, 15000);

    fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company: company }),
      signal: controller.signal
    })
      .then(function (res) { return res.text(); })
      .then(function (rawText) {
        clearTimeout(timeout);
        var cleaned = rawText.replace(/```json|```/g, '').trim();
        var data;
        try { data = JSON.parse(cleaned); } catch (e) { data = {}; }
        return fillFromLocalCsv(data, company);
      })
      .then(function (merged) {
        renderProfile(merged);
      })
      .catch(function () {
        clearTimeout(timeout);
        fillFromLocalCsv({}, company).then(function (merged) {
          if (cleanField(merged.overview) || cleanField(merged.website) || cleanField(merged.expectations)) {
            renderProfile(merged);
          } else {
            renderError();
          }
        });
      });
  }

  loadProfile();
})();
</script>
