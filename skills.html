<script>
(function () {
  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function splitList(str) {
    return String(str == null ? '' : str).split(',').map(function (s) {
      var trimmed = s.trim();
      if (trimmed.charAt(0) === '(' && trimmed.charAt(trimmed.length - 1) === ')') {
        trimmed = trimmed.slice(1, -1).trim();
      }
      return trimmed;
    }).filter(Boolean);
  }

  function titleCase(str) {
    if (!str) return str;
    return str.split(' ').map(function (word) {
      return word ? word.charAt(0).toUpperCase() + word.slice(1) : word;
    }).join(' ');
  }

  var raw = sessionStorage.getItem('jobready_diploma_data');
  var data = null;
  try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }

  var content = document.getElementById('flowContent');

  if (!data || !data.diploma) {
    content.innerHTML =
      '<div class="flow-empty"><p>We couldn\'t find your diploma selection. Let\'s start there.</p>' +
      '<a href="learning-hub.html" class="btn btn-primary">Choose Your Diploma &rarr;</a></div>';
    return;
  }

  document.getElementById('skillsTitle').textContent = data.diploma;
  document.getElementById('skillsSub').textContent = 'Skills you\'ll build in this diploma.';

  var skillPills = splitList(data.skillsLearned).map(function (s) {
    return '<span class="skill-pill">' + escapeHtml(titleCase(s)) + '</span>';
  }).join('');

  content.innerHTML =
    '<div class="pathway-card pathway-card-full">' +
      '<div class="pathway-card__head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg><span class="pathway-card__title">Skills You\'ll Build</span></div>' +
      '<div class="skill-pills">' + skillPills + '</div>' +
    '</div>' +
    '<div style="text-align:center;margin-top:2rem;">' +
      '<a href="career-path.html" class="btn btn-primary">View Career Path &rarr;</a>' +
    '</div>';
})();
</script>
